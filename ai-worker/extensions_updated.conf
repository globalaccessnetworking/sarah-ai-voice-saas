[from-nayatel]
exten => 32468161,1,NoOp(--- CALLING LIVEKIT VIA ENCRYPTED TLS ---)
same => n,Set(CALLERID(num)=+92${CALLERID(num):1})
; same => n,Answer()
same => n,Dial(PJSIP/+924232468161@livekit,60)
same => n,Hangup()

exten => 04232468161,1,Goto(32468161,1)

; MOVED THIS UP HERE: Route 2nd DID to Partner's Agent <---
exten => 32468162,1,NoOp(Inbound Call to Partner AI Agent)
exten => 32468162,n,Dial(PJSIP/partner_agent,30)
exten => 32468162,n,Hangup()

; ==========================================
; RING GROUP 101 - ESCALATION TO HUMAN AGENTS
; ==========================================
exten => 101,1,NoOp(Call Escalated from Sarah to Human Ring Group 101)
; Ring agent1, agent2, and agent3 all at the same time for 60 seconds
exten => 101,n,Dial(PJSIP/agent1&PJSIP/agent2&PJSIP/agent3,60)
exten => 101,n,Hangup()

exten => 04232468162,1,Goto(32468162,1)

[from-livekit]
; ==========================================
; ESCALATION RING GROUP (MUST BE AT THE TOP)
; ==========================================
; This handles the transfer_to_human tool for BOTH inbound and outbound LIVEKIT calls
exten => 101,1,NoOp(Outbound Call Escalation to Human Agents)
exten => 101,n,Dial(PJSIP/agent1&PJSIP/agent2&PJSIP/agent3,60)
exten => 101,n,Hangup()

; Match numbers starting with a '+' symbol (E.164 format from LiveKit)
exten => _+X.,1,NoOp(--- OUTBOUND CALL TO ${EXTEN} ---)
; 1. Tell Nayatel who is calling (MUST be your full 11-digit DID)
same => n,Set(CALLERID(num)=04232468161)
same => n,Set(CALLERID(name)=04232468161)
; 2. Clean the number: convert +92304... to 0304...
same => n,Set(TARGET_NUM=${EXTEN})
same => n,ExecIf($["${EXTEN:0:3}"="+92"]?Set(TARGET_NUM=0${EXTEN:3}))
; 3. Dial out via your Nayatel Trunk
same => n,Dial(PJSIP/${TARGET_NUM}@nayatel,60)
same => n,Hangup()

; Fallback: Just in case LiveKit ever sends a number without a '+'
exten => _X.,1,Goto(_+${EXTEN},1)
